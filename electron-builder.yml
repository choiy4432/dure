appId: io.github.choiy4432.dure
productName: Dure
directories:
  output: dist
files:
  - out/**
  - resources/icon.ico
  - package.json
# 휴대폰 서버가 렌더러 묶음(mobile.html·assets)을 진짜 파일로 읽어 내어 준다(realpath·stream) — app.asar.unpacked/out/renderer.
# 창은 그대로 app.asar/out/renderer/index.html 로 연다(Electron 이 풀린 파일을 알아서 읽는다)
asarUnpack:
  - out/renderer/**
# 안드로이드 앱(npm run android 가 굽는다) — 휴대폰 서버가 /dure.apk 로 내어 준다. asar 밖에 둬서 진짜 파일로 읽는다
extraResources:
  - from: resources/android
    to: android
    filter:
      - dure.apk
      - dure.apk.json
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: true
  perMachine: false
  artifactName: Dure-Setup-${version}.${ext}
  shortcutName: 두레
  deleteAppDataOnUninstall: false
  # 제거 때 휴대폰 연결 정리(두레가 연 serve 길·로그인 항목) — customUnInstall 이 `두레 --uninstall-cleanup` 을 기다린다. 앱 데이터는 지우지 않는다
  include: build/installer.nsh
publish:
  provider: github
  owner: choiy4432
  repo: dure
  releaseType: release
