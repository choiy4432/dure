appId: io.github.choiy4432.dure
productName: Dure
directories:
  output: dist
files:
  - out/**
  - resources/icon.ico
  - package.json
# 휴대폰 서버가 렌더러 묶음(mobile.html·assets)을 진짜 파일로 읽어 내어 준다(realpath·stream) — app.asar.unpacked/out/renderer.
# 창은 그대로 app.asar/out/renderer/index.html 로 연다(Electron 이 풀린 파일을 알아서 읽는다)
asarUnpack:
  - out/renderer/**
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: true
  perMachine: false
  artifactName: Dure-Setup-${version}.${ext}
  shortcutName: 두레
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: choiy4432
  repo: dure
  releaseType: release
